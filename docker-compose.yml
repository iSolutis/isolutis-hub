# Ambiente local completo: docker compose up --build  ->  http://localhost:8000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hub
      POSTGRES_DB: hub
    volumes: [dados:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d hub"]
      interval: 3s
      retries: 20
    ports: ["5432:5432"]

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db: { condition: service_healthy }
    environment:
      HUB_DATABASE_URL: postgresql+psycopg://hub:hub@db:5432/hub
      HUB_SECRET_KEY: ${HUB_SECRET_KEY:?defina HUB_SECRET_KEY (mínimo 32 caracteres)}
    ports: ["8000:8000"]

volumes:
  dados:
