<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Hub Comercial iSolutis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: barra lateral fixa com as seis áreas; no celular vira uma faixa de abas no topo. Formulários abrem numa gaveta à direita.
   Paleta iSolutis: azul-marinho do ícone + turquesa do "i". O turquesa puro só aparece sobre o marinho; sobre fundo claro usa-se o tom escurecido (--gold). */
:root{
  --navy:#1B2B4B; --navy-deep:#111b30; --teal:#22C3CE; --gold:#0d8792; --gold-soft:#dbf3f5;
  --bg:#eef1f6; --surface:#ffffff; --sunk:#e5eaf1; --line:#d3dbe6;
  --ink:#16223b; --muted:#56647a; --accent:#1B2B4B; --accent-ink:#ffffff;
  --bar-a:#1B2B4B; --bar-b:#9fdde2;
  --ok:#1f7a4d; --ok-bg:#e1f2e8; --warn:#9a6a00; --warn-bg:#fbefd2; --bad:#b0362f; --bad-bg:#f9e1df; --info:#2d5b94; --info-bg:#e1ebf7; --wa:#128c4a; --wa-ink:#ffffff;
  --f-display:"Montserrat",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1729; --surface:#16223b; --sunk:#111c32; --line:#2a3a57;
  --ink:#e8edf4; --muted:#a0afc4; --accent:#22C3CE; --accent-ink:#0e1729; --gold:#4fd3dc; --gold-soft:#123a44;
  --bar-a:#22C3CE; --bar-b:#33506e;
  --ok:#6fd19f; --ok-bg:#16352a; --warn:#f0c569; --warn-bg:#3a2f14; --bad:#f19189; --bad-bg:#3d1c1b; --info:#9cc2f0; --info-bg:#1a2d47; --wa:#3cc37a; --wa-ink:#07210f;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1729; --surface:#16223b; --sunk:#111c32; --line:#2a3a57;
  --ink:#e8edf4; --muted:#a0afc4; --accent:#22C3CE; --accent-ink:#0e1729; --gold:#4fd3dc; --gold-soft:#123a44;
  --bar-a:#22C3CE; --bar-b:#33506e;
  --ok:#6fd19f; --ok-bg:#16352a; --warn:#f0c569; --warn-bg:#3a2f14; --bad:#f19189; --bad-bg:#3d1c1b; --info:#9cc2f0; --info-bg:#1a2d47; --wa:#3cc37a; --wa-ink:#07210f;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* login (Supabase) */
.login{position:fixed;inset:0;z-index:40;background:#111b30;display:grid;place-items:center;padding:24px 16px;overflow-y:auto}
.login:before{content:"";position:fixed;right:-140px;top:-140px;width:420px;height:420px;border-radius:50%;border:56px solid #22C3CE;opacity:.12;pointer-events:none}
.lg-box{position:relative;width:min(400px,100%);display:flex;flex-direction:column;gap:18px}
.lg-topo{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.lg-topo img{width:200px;height:auto}
.lg-topo span{font:600 11px var(--f-display);letter-spacing:.18em;text-transform:uppercase;color:#93a3bd;padding-left:4px}
.lg-form{background:#ffffff;color:#16223b;border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:8px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.lg-form h1{font-size:22px;margin:0 0 6px;color:#1B2B4B}
.lg-form label{font-size:12px;font-weight:600;color:#56647a;margin-top:6px}
.lg-form input{border:1px solid #d3dbe6;background:#eef1f6;border-radius:6px;padding:10px 11px;font:inherit;color:#16223b}
.lg-form input:focus-visible{outline:2px solid #0d8792;outline-offset:1px}
.lg-form .btn{margin-top:12px;padding:10px 14px;background:#1B2B4B;color:#fff;border-color:#1B2B4B}
.lg-form .btn:not(.primary){background:#fff;color:#1B2B4B}
.lg-link{all:unset;cursor:pointer;align-self:center;margin-top:6px;font-size:13px;color:#0d8792;text-decoration:underline;text-underline-offset:3px}
.lg-link:focus-visible{outline:2px solid #0d8792;outline-offset:2px}
.lg-msg{margin:0;min-height:1.4em;color:#c6d0de;font-size:13px;text-align:center}
.lg-msg.erro{color:#f19189}
.conta{display:flex;flex-direction:column;gap:4px;padding:8px 8px 0;border-top:1px solid #24375c;font-size:11.5px;color:#93a3bd;min-width:0}
.conta span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conta button{all:unset;cursor:pointer;align-self:flex-start;color:#e8edf4;font-weight:600;font-size:12.5px}
.conta-b{display:flex;gap:16px;flex-wrap:wrap}
.conta button:hover{color:#22C3CE}
.conta button:focus-visible{outline:2px solid #22C3CE;outline-offset:2px}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body)}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%}
aside{background:var(--navy-deep);color:#dfe6ef;padding:20px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding-inline:6px}
.brand img{display:block;width:172px;max-width:100%;height:auto}
.brand small{display:block;padding-left:4px;font:600 9.5px/1.2 var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:#93a3bd}
nav{display:flex;flex-direction:column;gap:2px}
nav button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border-radius:8px;color:#c6d0de;font-weight:500}
nav button:hover{background:#1B2B4B;color:#fff}
nav button[aria-current="true"]{background:#24375c;color:#fff;box-shadow:inset 3px 0 0 #22C3CE}
nav button:focus-visible{outline:2px solid #22C3CE;outline-offset:1px}
nav .count{font:500 11px var(--f-mono);color:#93a3bd}
.online{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:12px 8px 0;border-top:1px solid #24375c}
.online:not([hidden]) + .sync{margin-top:0}
.on-t{font:600 10px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:#93a3bd}
.on-p{display:flex;align-items:center;gap:8px;min-width:0}
.av{position:relative;flex:none;width:28px;height:28px;border-radius:50%;overflow:hidden;background:#24375c;display:grid;place-items:center;font:600 11px var(--f-body);font-style:normal;color:#fff;box-shadow:0 0 0 2px #111b30}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av:after{content:"";position:absolute;right:0;bottom:0;width:8px;height:8px;border-radius:50%;background:#3cc37a;box-shadow:0 0 0 2px #111b30}
.on-n{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.on-n b{font-size:12.5px;color:#e8edf4;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.on-n small{font-size:11px;color:#93a3bd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner.conflito{margin:0;background:var(--bad-bg);color:var(--bad)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.pcard:hover{border-color:var(--muted)}
.pcard:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.pc-h{display:flex;gap:6px;flex-wrap:wrap}
.pc-t{font:600 16px/1.3 var(--f-display)}
.pc-m{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.prog{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:4px}
.prog i{display:block;height:100%;background:var(--bar-a);border-radius:3px}
.etapas{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.etapa{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.et-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.et-n{font:600 13px var(--f-display);color:var(--gold);min-width:22px}
.et-h input{flex:1 1 180px;min-width:0;font-weight:600;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px}
.et-h select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px}
.et-a{display:flex}
.et-a .btn{padding:4px 8px}
.etapa .field input,.etapa .field textarea{background:var(--surface)}
.etapa .field textarea{min-height:54px}
.sync{margin-top:auto;font-size:12px;color:#93a3bd;padding-inline:8px}
.sync .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#93a3bd;margin-right:6px;vertical-align:1px}
.sync.on .dot{background:#6fd19f}.sync.off .dot{background:#f19189}
main{padding-block:24px 64px;padding-inline:clamp(16px,3vw,36px);min-width:0}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px}
h1{font:600 26px/1.15 var(--f-display);margin:0;text-wrap:balance}
.head p{margin:4px 0 0;color:var(--muted)}
h2{font:600 15px/1.3 var(--f-display);margin:0 0 12px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:transparent;background:transparent}
.btn.danger.armed{background:var(--bad);color:#fff}
.btn.wa{background:var(--wa);border-color:var(--wa);color:var(--wa-ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.wa:hover{filter:brightness(1.08)}
.btn.wa svg{width:15px;height:15px;fill:currentColor;flex:none}
.btn.wa.mini{padding:2px 8px;font-size:12px;margin-top:3px}
.btn.wa[aria-disabled="true"]{background:var(--sunk);border-color:var(--line);color:var(--muted);cursor:default;filter:none}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.field :focus-visible,.card:focus-visible,tr[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.grid{display:grid;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font:600 24px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px}
.search{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 10px;min-width:0;width:240px;max-width:100%}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--sunk)}
td.r,th.r{text-align:right}
tbody tr[tabindex]{cursor:pointer}
tbody tr[tabindex]:hover{background:var(--sunk)}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:600;background:var(--sunk);border-bottom:0}
.sub{color:var(--muted);font-size:12px}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.info{background:var(--info-bg);color:var(--info)}.pill.gold{background:var(--gold-soft);color:var(--gold)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted);background:var(--surface)}
.empty b{display:block;color:var(--ink);font:600 16px var(--f-display);margin-bottom:4px}
.empty .btn{margin-top:12px}
/* Funil */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--sunk);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:180px}
.col.over{outline:2px dashed var(--gold);outline-offset:-2px}
.col-h{display:flex;justify-content:space-between;align-items:baseline;gap:6px;padding:2px 4px 6px;border-bottom:2px solid var(--line)}
.col-h b{font:600 13px var(--f-display)}
.col-h span{font-size:11px;color:var(--muted)}
.col.ganho .col-h{border-color:var(--ok)}.col.perdido .col-h{border-color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 11px;cursor:grab;display:flex;flex-direction:column;gap:3px}
.card:hover{border-color:var(--muted)}
.card .t{font-weight:600;line-height:1.3}
.card .m{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.card .late{color:var(--bad)}
.funnel{display:flex;flex-direction:column;gap:8px}
.frow{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.fbar{height:18px;background:var(--sunk);border-radius:3px;overflow:hidden}
.fbar i{display:block;height:100%;background:var(--bar-a);border-radius:3px;min-width:2px}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:0}
.li:hover .t{text-decoration:underline}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.banner{padding:10px 14px;border-radius:6px;background:var(--warn-bg);color:var(--warn);margin-bottom:16px;font-size:13px}
/* Gaveta */
.scrim{position:fixed;inset:0;background:rgba(8,14,24,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--surface);z-index:21;display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(0,0,0,.2);padding-top:env(safe-area-inset-top,0px)}
.drawer header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.drawer header h2{margin:0;font-size:18px}
.drawer .body{overflow-y:auto;padding:18px 20px;flex:1;display:flex;flex-direction:column;gap:14px}
.drawer footer{display:flex;flex-wrap:wrap;gap:8px;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--sunk)}
.drawer footer .sp{flex:1}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
.field textarea{min-height:72px;resize:vertical}
.check{display:flex;gap:8px;align-items:center;font-weight:500}
.items td,.items th{padding:6px}
.items input,.items select{border:1px solid var(--line);background:var(--bg);border-radius:5px;padding:5px 6px;width:100%;min-width:0}
.totals{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.totals .big{font:600 20px var(--f-display)}
.related h3{font:600 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 0 4px}
.gen{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;z-index:30;font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 11px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
@media (max-width:860px){
  .brand img{width:104px}
  .brand{flex:none}
  .app{grid-template-columns:minmax(0,1fr)}
  aside{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;gap:10px;padding:10px 16px;z-index:10;overflow-x:auto}
  .brand small,.sync,.on-t,.on-n,.conta span{display:none}
  .conta{border:0;padding:0;flex:none}
  .online{margin:0 0 0 auto;flex-direction:row;padding:0;border:0;gap:4px}
  nav{flex-direction:row}
  nav .count{display:none}
  nav button{padding:7px 10px;white-space:nowrap}
  nav button[aria-current="true"]{box-shadow:inset 0 -3px 0 #22C3CE}
  .two{grid-template-columns:minmax(0,1fr)}
  .fields{grid-template-columns:minmax(0,1fr)}
  .frow{grid-template-columns:110px minmax(0,1fr) auto}
}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><span id="logoSide"></span><small>Hub Comercial</small></div>
    <nav id="nav" aria-label="Áreas do Hub Comercial"></nav>
    <div class="online" id="online" hidden aria-live="polite"></div>
    <div class="sync" id="sync"><span class="dot"></span>Conectando…</div>
    <div class="conta" id="conta" hidden><span id="contaEmail"></span><div class="conta-b"><button type="button" id="trocarSenha">Trocar senha</button><button type="button" id="sair">Sair</button></div></div>
  </aside>
  <main id="view"></main>
</div>
<div id="layer"></div>

<div class="login" id="login" hidden>
  <div class="lg-box">
    <div class="lg-topo"><img id="lgLogo" alt="iSolutis" width="200" height="77"><span>Hub Comercial</span></div>
    <form id="lgEntrar" class="lg-form" novalidate>
      <h1>Entrar</h1>
      <label for="lgEmail">E-mail</label><input id="lgEmail" type="email" autocomplete="username" required>
      <label for="lgSenha">Senha</label><input id="lgSenha" type="password" autocomplete="current-password" required>
      <button class="btn primary" type="submit" id="lgBotao">Entrar</button>
      <button class="lg-link" type="button" id="lgEsqueci">Esqueci minha senha</button>
    </form>
    <form id="lgNova" class="lg-form" novalidate hidden>
      <h1>Crie sua senha</h1>
      <p class="sub" style="margin:0">Use pelo menos 8 caracteres. É com ela que você vai entrar no Hub.</p>
      <label for="lgNova1">Nova senha</label><input id="lgNova1" type="password" autocomplete="new-password" minlength="8" required>
      <label for="lgNova2">Repita a senha</label><input id="lgNova2" type="password" autocomplete="new-password" minlength="8" required>
      <button class="btn primary" type="submit">Salvar senha</button>
      <button class="lg-link" type="button" id="lgCancelar" hidden>Cancelar</button>
    </form>
    <div id="lgFora" class="lg-form" hidden>
      <h1>Acesso não liberado</h1>
      <p style="margin:0">O e-mail <b id="lgForaEmail"></b> entrou, mas ainda não faz parte da equipe do Hub. Peça para a Soraya incluir este e-mail.</p>
      <button class="btn" type="button" id="lgForaSair">Sair e entrar com outro e-mail</button>
    </div>
    <p class="lg-msg" id="lgMsg" role="status"></p>
  </div>

<script>
/* ---------- Supabase: login, banco, tempo real e presença ----------
   Expõe window.HubSupabase.iniciar(), que só resolve depois do login e devolve
   objetos com a mesma forma que o restante do Hub usa (db, user, room, downloads). */
window.HubSupabase = (() => {
  const URL_SUPABASE = 'https://dqpatgyqyqonikbbgymu.supabase.co';
  const CHAVE_PUBLICA = 'sb_publishable_wTyuZRM40gvpQSFZmY_cdg_S-CuK6Ci'; // chave pública: a proteção dos dados está nas regras do banco
  const tabela = col => 'hub_' + col;
  // o link do e-mail (convite ou troca de senha) chega com #...type=invite|recovery; leio antes do SDK limpar
  const urlLink = location.hash + '&' + location.search;
  let tipoLink = (urlLink.match(/type=([a-z]+)/) || [])[1] || '';
  // link vencido ou já usado: o Supabase devolve #error_code=otp_expired (ou parecido)
  const erroLink = decodeURIComponent(((urlLink.match(/error_description=([^&]+)/) || [])[1] || '').replace(/\+/g, ' '));
  const codigoErroLink = (urlLink.match(/error_code=([a-z_]+)/) || [])[1] || '';
  const sb = window.supabase.createClient(URL_SUPABASE, CHAVE_PUBLICA, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
  const $ = id => document.getElementById(id);
  const msg = (t, erro) => { const m = $('lgMsg'); m.textContent = t || ''; m.classList.toggle('erro', !!erro); };
  const novoId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
  const converter = e => ({ code: e && e.code === '42501' ? 'invalid_argument' : 'unavailable', message: (e && e.message) || 'erro' });

  function mostrar(qual){ $('login').hidden = false; ['lgEntrar','lgNova','lgFora'].forEach(id => $(id).hidden = id !== qual); }

  function pedirLogin(){
    mostrar('lgEntrar'); setTimeout(() => $('lgEmail').focus(), 50);
    return new Promise(resolve => {
      $('lgEntrar').onsubmit = async e => {
        e.preventDefault();
        const email = $('lgEmail').value.trim(), senha = $('lgSenha').value;
        if (!email || !senha) { msg('Preencha o e-mail e a senha.', true); return; }
        $('lgBotao').disabled = true; msg('Entrando…');
        const { data, error } = await sb.auth.signInWithPassword({ email, password: senha });
        $('lgBotao').disabled = false;
        if (error) { msg(/invalid/i.test(error.message) ? 'E-mail ou senha incorretos. Confira e tente de novo, ou use "Esqueci minha senha".' : 'Não foi possível entrar agora: ' + error.message, true); return; }
        msg(''); resolve(data.session);
      };
      $('lgEsqueci').onclick = async () => {
        const email = $('lgEmail').value.trim();
        if (!email) { msg('Digite seu e-mail acima e clique de novo em "Esqueci minha senha".', true); $('lgEmail').focus(); return; }
        const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
        msg(error ? 'Não foi possível enviar o e-mail agora: ' + error.message : 'Se este e-mail estiver cadastrado, chega em instantes um link para criar uma nova senha.', !!error);
      };
    });
  }

  function pedirNovaSenha(){
    mostrar('lgNova'); setTimeout(() => $('lgNova1').focus(), 50);
    return new Promise(resolve => {
      $('lgNova').onsubmit = async e => {
        e.preventDefault();
        const a = $('lgNova1').value, b = $('lgNova2').value;
        if (a.length < 8) { msg('A senha precisa ter pelo menos 8 caracteres.', true); return; }
        if (a !== b) { msg('As duas senhas não são iguais.', true); return; }
        const { error } = await sb.auth.updateUser({ password: a, data: { senha_definida: true } });
        if (error) { msg(/different from the old/i.test(error.message) ? 'Essa já é a sua senha atual. Escolha uma diferente.' : 'Não foi possível salvar a senha: ' + error.message, true); return; }
        msg('Senha salva.'); history.replaceState(null, '', location.pathname); resolve();
      };
    });
  }

  async function sair(){ await sb.auth.signOut(); location.replace(location.pathname); }

  /* banco: uma tabela por área, cada linha guarda o registro inteiro em "dados" */
  const recarregar = {};
  function criarDb(){
    const collection = col => {
      const t = tabela(col);
      const q = {
        limit(){ return q; },
        onSnapshot(next, onErr){
          let vivo = true, timer = null;
          const carregar = async () => {
            const { data, error } = await sb.from(t).select('id,dados').limit(5000);
            if (!vivo) return;
            if (error) { onErr && onErr(converter(error)); return; }
            next({ docs: data.map(r => ({ id: r.id, exists: true, data: () => r.dados || {} })) });
          };
          const agendar = () => { clearTimeout(timer); timer = setTimeout(carregar, 120); };
          recarregar[t] = agendar;
          const canal = sb.channel('mudancas-' + t)
            .on('postgres_changes', { event: '*', schema: 'public', table: t }, agendar)
            .subscribe();
          carregar();
          return () => { vivo = false; sb.removeChannel(canal); };
        },
        doc(id){
          id = id || novoId();
          return {
            id,
            async set(dados){ const { error } = await sb.from(t).upsert({ id, dados }); if (error) throw converter(error); recarregar[t] && recarregar[t](); },
            async delete(){ const { error } = await sb.from(t).delete().eq('id', id); if (error) throw converter(error); recarregar[t] && recarregar[t](); }
          };
        }
      };
      return q;
    };
    return { collection };
  }

  /* quem é quem: o e-mail é o identificador gravado em criadoPor/alteradoPor */
  function criarUser(eu, membros){
    const porEmail = {}; membros.forEach(m => porEmail[m.email.toLowerCase()] = m);
    const perfil = id => ({ name: (porEmail[String(id || '').toLowerCase()] || {}).nome || '', avatarUrl: '' });
    return {
      can: async () => true,
      me: async () => ({ id: eu.email.toLowerCase(), name: eu.nome, avatarUrl: '' }),
      profiles: async ids => { const r = {}; ids.forEach(i => r[i] = perfil(i)); return r; }
    };
  }

  /* "Usando agora": presença em tempo real do Supabase */
  function criarRoom(eu){
    const meuId = eu.email.toLowerCase(), aba = novoId();
    let estado = {}, pronto = false;
    const ouvintes = [];
    const canal = sb.channel('hub-presenca', { config: { presence: { key: aba } } });
    const avisar = () => {
      const st = canal.presenceState();
      const peers = Object.entries(st).map(([k, metas]) => { const m = metas[0] || {}; return { peer: k, by: m.email, isMe: m.email === meuId, sameTab: k === aba, kind: 'viewer', guest: false, presence: m.presenca || {} }; });
      ouvintes.forEach(f => f({ peers }));
    };
    canal.on('presence', { event: 'sync' }, avisar)
      .subscribe(async st => { if (st === 'SUBSCRIBED') { pronto = true; await canal.track({ email: meuId, presenca: estado }); } });
    return {
      async presence(patch){
        estado = { ...estado, ...patch }; Object.keys(estado).forEach(k => { if (estado[k] === null) delete estado[k]; });
        if (pronto) await canal.track({ email: meuId, presenca: estado });
      },
      onPeers(fn){ ouvintes.push(fn); return () => {}; }
    };
  }

  /* downloads: aqui é um site comum, então o navegador baixa o arquivo direto */
  function criarDownloads(){
    return { async save({ filename, data }){
      const tipo = /\.csv$/i.test(filename) ? 'text/csv;charset=utf-8' : 'text/html;charset=utf-8';
      const url = URL.createObjectURL(new Blob([data], { type: tipo }));
      const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    } };
  }

  /* gestão de usuários: chama a Edge Function "hub-admin", que roda no Supabase com a chave secreta */
  function criarAdmin(){
    const chamar = async body => {
      const { data, error } = await sb.functions.invoke('hub-admin', { body });
      if (error) {
        let m = error.message || 'erro';
        try { const j = await error.context.json(); if (j && j.erro) m = j.erro; } catch(_){}
        if (/Failed to send a request|not found|404/i.test(m)) m = 'O painel de usuários ainda não foi ativado no Supabase: falta publicar a função "hub-admin".';
        throw new Error(m);
      }
      if (data && data.erro) throw new Error(data.erro);
      return data;
    };
    return {
      listar: () => chamar({ acao: 'listar' }),
      salvar: u => chamar({ acao: 'salvar', ...u }),
      remover: email => chamar({ acao: 'remover', email })
    };
  }

  async function iniciar(){
    $('sair').onclick = sair; $('lgForaSair').onclick = sair;
    sb.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY') tipoLink = 'recovery'; });
    let { data: { session } } = await sb.auth.getSession();
    if (!session && codigoErroLink) {
      msg(codigoErroLink === 'otp_expired'
        ? 'O link do e-mail venceu ou já foi usado. Digite seu e-mail abaixo e clique em "Esqueci minha senha" para receber um novo.'
        : 'O link do e-mail não funcionou (' + (erroLink || codigoErroLink) + '). Use "Esqueci minha senha" para receber um novo.', true);
      history.replaceState(null, '', location.pathname);
    }
    // primeiro acesso de quem foi convidado: pede a senha mesmo que o link não diga o tipo
    const precisaSenha = s => s && (tipoLink === 'recovery' || tipoLink === 'invite' || (s.user.invited_at && !(s.user.user_metadata || {}).senha_definida));
    if (precisaSenha(session)) await pedirNovaSenha();
    if (!session) session = await pedirLogin();
    $('trocarSenha').onclick = async () => {
      $('lgCancelar').hidden = false;
      $('lgCancelar').onclick = () => { $('login').hidden = true; $('lgCancelar').hidden = true; msg(''); };
      await pedirNovaSenha(); $('login').hidden = true; $('lgCancelar').hidden = true;
    };
    const email = session.user.email;
    const { data: membros, error } = await sb.from('hub_membros').select('*');
    if (error) { msg('Não foi possível ler a equipe do Hub: ' + error.message, true); mostrar(''); throw error; }
    const eu = (membros || []).find(m => m.email.toLowerCase() === String(email).toLowerCase());
    if (!eu) { $('lgForaEmail').textContent = email; mostrar('lgFora'); return new Promise(() => {}); }
    $('login').hidden = true;
    $('contaEmail').textContent = eu.nome + ' · ' + email; $('conta').hidden = false;
    sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') location.replace(location.pathname); });
    return { db: criarDb(), user: criarUser(eu, membros), room: criarRoom(eu), downloads: criarDownloads(), admin: eu.admin ? criarAdmin() : null };
  }

  return { iniciar };
})();
</script>

function waNumero(tel){
  let d = String(tel||'').replace(/\D/g,'');
  if (d.startsWith('00')) d = d.slice(2);
  if (d.length===10 || d.length===11) d = '55'+d;
  return d.length>=12 ? d : '';
}
const waUrl = (tel, texto) => 'https://wa.me/'+waNumero(tel)+(texto?'?text='+encodeURIComponent(texto):'');
const primeiroNome = c => (c?.contato||'').trim().split(/\s+/)[0] || '';
const textoContato = c => `Olá${primeiroNome(c)?', '+primeiroNome(c):''}! Aqui é da iSolutis.`;
function botaoWa(c, rotulo='WhatsApp', texto, extra=''){
  if (!waNumero(c?.telefone)) return `<span class="btn wa ${extra}" aria-disabled="true" title="Cadastre o WhatsApp do cliente para usar este botão">${WA_ICON}${rotulo}</span>`;
  return `<a class="btn wa ${extra}" href="${esc(waUrl(c.telefone, texto ?? textoContato(c)))}" target="_blank" rel="noopener">${WA_ICON}${rotulo}</a>`;
}
function textoOrcamento(o, c){
  const t = totaisOrc(o), valido = addDias(o.data||hoje(), num(o.validade)||15);
  const itens = (o.itens||[]).filter(i=>i.descricao||num(i.preco)).map(i=>`• ${i.descricao||'Item'}${num(i.qtd)>1?` (${String(num(i.qtd)).replace('.',',')}×)`:''}: ${brl((num(i.qtd)||1)*num(i.preco))}${i.mensal?'/mês':''}`);
  const linhas = [
    `Olá${primeiroNome(c)?', '+primeiroNome(c):''}! Segue o orçamento Nº ${o.numero} da iSolutis${c?.nome?' para '+c.nome:''}:`, '',
    ...itens, '',
    ...(num(o.desconto)?[`Desconto: −${brl(o.desconto)}`]:[]),
    `*Valor do projeto: ${brl(t.unico)}*`,
    ...(t.mensal?[`*Manutenção mensal: ${brl(t.mensal)}/mês*`]:[]),
    `Válido até ${dataBR(valido)}.`,
    ...(o.obs?['', o.obs]:[]),
    '', 'Fico à disposição para qualquer dúvida.'
  ];
  return linhas.join('\n');
}
function valorNegocio(n){ const p=[]; if (num(n.valor)) p.push(brl(n.valor)); if (num(n.mensal)) p.push(brl(n.mensal)+'/mês'); return p.join(' + ') || 'sem valor'; }

async function salvar(col, id, dados){
  if (!db) { toast('Entre com seu e-mail e senha para salvar.'); return null; }
  try {
    const ref = id ? db.collection(col).doc(id) : db.collection(col).doc();
    const autoria = {alteradoEm:new Date().toISOString()};
    if (eu.id){ autoria.alteradoPor = eu.id; if (!id && !dados.criadoPor) autoria.criadoPor = eu.id; }
    if (aberto && aberto.col===col && aberto.id===id) aberto.meu = autoria.alteradoEm;
    await ref.set({...dados, ...autoria});
    return ref.id;
  } catch(e){ erro(e); return null; }
}
async function excluir(col, id){ try { if (aberto && aberto.col===col && aberto.id===id) aberto.excluidoPorMim=true; await db.collection(col).doc(id).delete(); return true; } catch(e){ erro(e); return false; } }

const nomesCache = {};
async function nomes(ids){
  ids = [...new Set(ids.filter(Boolean))];
  if (!userApi || !ids.length) return {};
  try { const ps = await userApi.profiles(ids); for (const k in ps) nomesCache[k]=ps[k]; return ps; } catch(_){ return {}; }
}
const nomeDe = id => id===eu.id ? 'você' : (nomesCache[id]?.name || 'outra pessoa da equipe');
function quando(iso){ if(!iso) return ''; const d=new Date(iso); if(isNaN(d)) return ''; return pad(d.getDate())+'/'+pad(d.getMonth()+1)+' às '+pad(d.getHours())+':'+pad(d.getMinutes()); }
function linhaAutoria(r){
  if (!r || !r.id || (!r.criadoPor && !r.alteradoPor)) return '';
  const partes = [];
  if (r.criadoPor) partes.push(`Cadastrado por <b data-uid="${esc(r.criadoPor)}">${esc(nomeDe(r.criadoPor))}</b>`);
  if (r.alteradoPor) partes.push(`última alteração por <b data-uid="${esc(r.alteradoPor)}">${esc(nomeDe(r.alteradoPor))}</b>${r.alteradoEm?' em '+quando(r.alteradoEm):''}`);
  return `<p class="sub autoria" style="margin:0">${partes.join(' · ')}</p>`;
}
async function preencherNomes(raiz){
  const els = $$('[data-uid]', raiz); if(!els.length) return;
  await nomes(els.map(e=>e.dataset.uid));
  els.forEach(e=>{ e.textContent = nomeDe(e.dataset.uid); });
}
function contarPresenca(extra){ if (room) room.presence({area:view, ...extra}).catch(()=>{}); }
// avisa quem está com a gaveta aberta se outra pessoa mudar ou excluir o mesmo registro
function verificarConflito(col){
  if (!aberto || aberto.col!==col || !aberto.id) return;
  const atual = byId(col, aberto.id), box = $('#conflito'); if (!box) return;
  if (!atual){ if (aberto.excluidoPorMim) return; box.hidden=false; box.innerHTML='Outra pessoa da equipe <b>excluiu este registro</b> enquanto você estava com ele aberto. Se salvar, ele será criado de novo.'; return; }
  if (atual.alteradoEm && atual.alteradoEm!==aberto.versao && atual.alteradoEm!==aberto.meu && atual.alteradoPor!==eu.id){
    box.hidden=false;
    box.innerHTML = `<b data-uid="${esc(atual.alteradoPor||'')}">${esc(nomeDe(atual.alteradoPor))}</b> acabou de alterar este registro. Feche e abra de novo para ver a versão atual. Se salvar agora, a alteração dessa pessoa será substituída pela sua.`;
    preencherNomes(box);

}
const iniciais = n => (n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(p=>p[0].toUpperCase()).join('');
const AREA_NOME = {painel:'Painel', clientes:'Clientes', negocios:'Negócios', orcamentos:'Orçamentos', faturamento:'Faturamento', despesas:'Despesas', produtos:'Produtos', projetos:'Projetos'};
async function desenharOnline(peers){
  const el = $('#online'); if (!el) return;
  const porPessoa = new Map();
  for (const p of peers){ if (p.kind!=='viewer') continue; const k = p.by || p.peer; const atual = porPessoa.get(k); if (!atual || (p.presence?.editando && !atual.presence?.editando)) porPessoa.set(k, p); }
  const lista = [...porPessoa.values()].sort((a,b)=>(b.isMe?1:0)-(a.isMe?1:0));
  const ps = await nomes(lista.map(p=>p.by));
  el.hidden = !lista.length;
  el.innerHTML = `<div class="on-t">Usando agora · ${lista.length}</div>` + lista.map(p=>{
    const pr = ps[p.by] || nomesCache[p.by] || {};
    const nome = p.isMe ? (eu.nome ? eu.nome.split(' ')[0]+' (você)' : 'Você') : (pr.name || 'Pessoa da equipe');
    const onde = p.presence?.editando ? 'editando '+String(p.presence.editando).slice(0,40) : (AREA_NOME[p.presence?.area] || '');
    const av = pr.avatarUrl ? `<img src="${esc(pr.avatarUrl)}" alt="">` : `<span>${esc(iniciais(pr.name))}</span>`;
    return `<div class="on-p" title="${esc(nome+(onde?' · '+onde:''))}"><i class="av">${av}</i><div class="on-n"><b>${esc(nome)}</b><small>${esc(onde)}</small></div></div>`;
  }).join('');
}

  <div class="kpis">

function grafico(serie){
  const W=720,H=230,L=64,R=8,T=12,B=28, iw=W-L-R, ih=H-T-B;
  const max = Math.max(...serie.map(s=>s.rec+s.prev));
  const passo = escalaPasso(max||1000), topo = Math.max(passo, Math.ceil((max||1)/passo)*passo);
  const y = v => T+ih-(v/topo)*ih, bw = iw/serie.length;
  let g='';
  for (let v=0; v<=topo+1e-9; v+=passo){ g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${brlCurto(v).replace('R$ ','')}</text>`; }
  serie.forEach((s,i)=>{
    const x=L+i*bw+bw*0.18, w=bw*0.64;
    const hr=(s.rec/topo)*ih, hp=(s.prev/topo)*ih;
    if (hp>0) g+=`<rect x="${x}" y="${y(s.rec+s.prev)}" width="${w}" height="${hp}" fill="var(--bar-b)" rx="2"><title>${s.rot}: ${brl(s.prev)} previsto</title></rect>`;
    if (hr>0) g+=`<rect x="${x}" y="${y(s.rec)}" width="${w}" height="${hr}" fill="var(--bar-a)" rx="2"><title>${s.rot}: ${brl(s.rec)} recebido</title></rect>`;
    g+=`<text x="${x+w/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="${s.atual?'var(--ink)':'var(--muted)'}" font-weight="${s.atual?600:400}">${s.rot}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Faturamento mensal">${g}</svg>`;
}
function escalaPasso(max){ const raw=max/4, p=Math.pow(10,Math.floor(Math.log10(raw))), f=raw/p; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p; }

/* ---------- Faturamento ---------- */
function vFaturamento(){
  const ano = ui.ano;
  const anos = [...new Set([new Date().getFullYear(), ...state.faturamento.map(f=>Number((f.data||'').slice(0,4))).filter(Boolean)])].sort();
  const doAno = state.faturamento.filter(f=>(f.data||'').startsWith(ano+'-'));
  const mk = mesKey(hoje());
  const meses = MESES.map((m,i)=>{ const k=ano+'-'+pad(i+1); const fs=doAno.filter(f=>mesKey(f.data)===k);
    return {k, nome:m, rec:fs.filter(f=>f.status==='recebido').reduce((s,f)=>s+num(f.valor),0), prev:fs.filter(f=>f.status!=='recebido').reduce((s,f)=>s+num(f.valor),0), mensal:fs.filter(f=>f.tipo==='mensal').reduce((s,f)=>s+num(f.valor),0), n:fs.length}; });
  let acum=0;
  const tRec = meses.reduce((s,m)=>s+m.rec,0), tPrev = meses.reduce((s,m)=>s+m.prev,0);
  const lista = doAno.filter(f=>!ui.mes || mesKey(f.data)===ui.mes).sort((a,b)=>(a.data||'').localeCompare(b.data||''));

async function baixarRelatorio(p){
  if(!downloads) return;
  const c = byId('clientes', p.clienteId);
  try { await downloads.save({filename:`Plano-de-entrega-${(p.titulo||'projeto').replace(/[^\p{L}\p{N}]+/gu,'-')}${c?'-'+c.nome.replace(/[^\p{L}\p{N}]+/gu,'-'):''}.html`, data:relatorioProjeto(p)}); toast('Relatório baixado. Abra no navegador e use Imprimir → Salvar como PDF.'); }
  catch(e){ if(e?.code!=='declined') toast('Não foi possível baixar o relatório agora.'); }
}

/* ---------- Despesas e investimentos ---------- */
const CAT_DESPESA = ['Servidores e infraestrutura','Softwares e assinaturas','Pessoal e terceiros','Impostos e taxas','Contabilidade','Marketing e anúncios','Escritório','Equipamentos','Deslocamento','Outros'];
const FORMAS_INVEST = ['Dinheiro (aporte)','Equipamento','Pagamento de despesa da empresa','Outro'];
const SOCIOS = ['Soraya Sá','Jefferson Pereira','Gileade Teixeira','Alexandre'];
function vDespesas(){
  const ano = ui.ano, mk = mesKey(hoje());
  const anos = [...new Set([new Date().getFullYear(), ...state.despesas.map(d=>Number((d.data||'').slice(0,4))), ...state.faturamento.map(f=>Number((f.data||'').slice(0,4)))].filter(Boolean))].sort();
  const doAno = state.despesas.filter(d=>(d.data||'').startsWith(ano+'-'));
  const desp = doAno.filter(d=>d.tipo!=='investimento'), inv = doAno.filter(d=>d.tipo==='investimento');
  const recAno = state.faturamento.filter(f=>(f.data||'').startsWith(ano+'-') && f.status==='recebido').reduce((s,f)=>s+num(f.valor),0);
  const despPagas = desp.filter(d=>d.status!=='a_pagar').reduce((s,d)=>s+num(d.valor),0);
  const despAPagar = desp.filter(d=>d.status==='a_pagar').reduce((s,d)=>s+num(d.valor),0);
  const invAno = inv.reduce((s,d)=>s+num(d.valor),0);
  const invTotal = state.despesas.filter(d=>d.tipo==='investimento').reduce((s,d)=>s+num(d.valor),0);
  const resultado = recAno - despPagas;
  // quem investiu: no ano e desde o início
  const porPessoa = {};
  state.despesas.filter(d=>d.tipo==='investimento').forEach(d=>{ const k=d.investidor||'Não informado'; porPessoa[k]=porPessoa[k]||{ano:0,total:0}; porPessoa[k].total+=num(d.valor); if((d.data||'').startsWith(ano+'-')) porPessoa[k].ano+=num(d.valor); });
  const pessoas = Object.entries(porPessoa).sort((a,b)=>b[1].total-a[1].total);
  const maxP = Math.max(1,...pessoas.map(p=>p[1].total));
  const meses = MESES.map((m,i)=>{ const k=ano+'-'+pad(i+1);
    const rec = state.faturamento.filter(f=>mesKey(f.data)===k && f.status==='recebido').reduce((s,f)=>s+num(f.valor),0);
    const dp = desp.filter(d=>mesKey(d.data)===k).reduce((s,d)=>s+num(d.valor),0);
    const iv = inv.filter(d=>mesKey(d.data)===k).reduce((s,d)=>s+num(d.valor),0);
    return {k, nome:m, rec, dp, iv}; });
  const filtro = ui.despTipo;
  const lista = doAno.filter(d=>filtro==='todos' || (filtro==='investimento' ? d.tipo==='investimento' : d.tipo!=='investimento')).filter(d=>!ui.mes || mesKey(d.data)===ui.mes).sort((a,b)=>(a.data||'').localeCompare(b.data||''));
  const vazio = !state.despesas.length;
  return `<div class="head"><div><h1>Despesas e investimentos</h1><p>O que sai do caixa, o que os sócios colocaram na empresa e quanto sobra do que foi recebido.</p></div>
    <div class="tools"><div class="field" style="flex-direction:row;align-items:center;gap:6px"><label for="ano">Ano</label><select id="ano">${anos.map(a=>`<option ${a===ano?'selected':''}>${a}</option>`).join('')}</select></div>
    ${canWrite&&!dbMissing?'<button class="btn" data-act="novoInvest">Novo investimento</button><button class="btn primary" data-act="novaDespesa">Nova despesa</button>':''}</div></div>
  ${vazio ? `<div class="empty" style="margin-bottom:16px"><b>Nenhuma despesa ou investimento registrado</b>Registre as despesas da empresa (servidores, softwares, contador, impostos) e os aportes de cada sócio. O resultado do ano é calculado com o faturamento recebido.${canWrite&&!dbMissing?'<br><button class="btn primary" data-act="novaDespesa">Registrar despesa</button> <button class="btn" data-act="novoInvest">Registrar investimento</button>':''}</div>`:''}
  <div class="kpis">
    <div class="kpi"><span class="l">Recebido em ${ano}</span><span class="v">${brl(recAno)}</span><span class="s">faturamento marcado como recebido</span></div>
    <div class="kpi"><span class="l">Despesas pagas</span><span class="v">${brl(despPagas)}</span><span class="s">${despAPagar?brl(despAPagar)+' ainda a pagar':'nada pendente'}</span></div>
    <div class="kpi"><span class="l">Resultado</span><span class="v" style="color:${resultado<0?'var(--bad)':'var(--ok)'}">${brl(resultado)}</span><span class="s">recebido menos despesas pagas</span></div>
    <div class="kpi"><span class="l">Investido em ${ano}</span><span class="v">${brl(invAno)}</span><span class="s">${brl(invTotal)} desde o início</span></div>
  </div>
  <div class="two">
    <div class="tbl-wrap"><table style="min-width:520px"><thead><tr><th>Mês</th><th class="r">Recebido</th><th class="r">Despesas</th><th class="r">Resultado</th><th class="r">Investimentos</th></tr></thead><tbody>
      ${meses.map(m=>{ const r=m.rec-m.dp; return `<tr tabindex="0" data-mes="${m.k}" style="${ui.mes===m.k?'background:var(--gold-soft)':''}"><td>${m.nome}${m.k===mk?' <span class="pill gold">atual</span>':''}</td><td class="r num">${m.rec?brl(m.rec):'—'}</td><td class="r num">${m.dp?brl(m.dp):'—'}</td><td class="r num" style="${r<0?'color:var(--bad)':''}">${m.rec||m.dp?brl(r):'—'}</td><td class="r num">${m.iv?brl(m.iv):'—'}</td></tr>`; }).join('')}
    </tbody><tfoot><tr><td>Total ${ano}</td><td class="r num">${brl(recAno)}</td><td class="r num">${brl(despPagas+despAPagar)}</td><td class="r num">${brl(recAno-despPagas-despAPagar)}</td><td class="r num">${brl(invAno)}</td></tr></tfoot></table></div>
    <div class="panel"><h2>Quem investiu</h2>
      ${pessoas.length ? `<div class="funnel">${pessoas.map(([n,v])=>`<div class="frow"><span>${esc(n)}</span><div class="fbar"><i style="width:${Math.max(3,100*v.total/maxP)}%"></i></div><span class="num">${brl(v.total)}</span></div><div class="sub" style="margin:-6px 0 4px">${v.ano?brl(v.ano)+' em '+ano+' · ':''}${invTotal?Math.round(100*v.total/invTotal)+'% do total investido':''}</div>`).join('')}</div>`
      : `<p class="sub">Cada investimento registra quem colocou o dinheiro. O total de cada pessoa aparece aqui.</p>`}
    </div>
  </div>
  <div class="panel" style="margin-top:16px">
    <div class="head" style="margin-bottom:10px"><h2 style="margin:0">${ui.mes?'Lançamentos de '+MESES[Number(ui.mes.slice(5))-1].toLowerCase()+' <button class="btn ghost" data-act="limparMes">ver o ano todo</button>':'Lançamentos de '+ano}</h2>
      <div class="seg" role="group" aria-label="Filtrar">${[['todos','Todos'],['despesa','Despesas'],['investimento','Investimentos']].map(([k,r])=>`<button data-despf="${k}" aria-pressed="${filtro===k}">${r}</button>`).join('')}</div></div>
    ${lista.length ? `<div class="list">${lista.map(d=>{ const inv=d.tipo==='investimento'; return `<div class="li" data-open="desp:${d.id}" tabindex="0"><div><div class="t">${esc(d.descricao||(inv?'Investimento':d.categoria)||'Despesa')}</div><div class="sub">${dataBR(d.data)} · ${inv?'Investido por <b>'+esc(d.investidor||'não informado')+'</b>'+(d.forma?' · '+esc(d.forma):''):esc(d.categoria||'Sem categoria')}${d.fornecedor?' · '+esc(d.fornecedor):''}</div></div><div style="text-align:right"><div class="num">${inv?'':'− '}${brl(d.valor)}</div>${inv?'<span class="pill info">Investimento</span>':d.status==='a_pagar'?`<span class="pill warn">A pagar</span>${canWrite&&!dbMissing?` <button class="btn ghost" data-pagar="${d.id}" style="padding:0 4px;font-size:12px">marcar pago</button>`:''}`:'<span class="pill">Paga</span>'}</div></div>`; }).join('')}</div>`
    : `<p class="sub">Nenhum lançamento ${ui.mes?'neste mês':'neste ano'} com esse filtro.</p>`}
  </div>`;
}
function formDespesa(d={tipo:'despesa'}){
  gavetaReg = {col:'despesas', reg:d};
  const novo=!d.id, inv=d.tipo==='investimento';
  const investidores = [...new Set([...SOCIOS, ...state.despesas.map(x=>x.investidor).filter(Boolean)])];
  const fornecedores = [...new Set(state.despesas.map(x=>x.fornecedor).filter(Boolean))];
  abrirGaveta(novo?(inv?'Novo investimento':'Nova despesa'):(inv?'Investimento':'Despesa'), `<div class="fields">
    ${campo('Tipo', sel('tipo', [['despesa','Despesa'],['investimento','Investimento']], d.tipo))}
    ${campo('Data', inp('data', d.data||hoje(), 'type="date"'))}
    ${campo('Descrição', inp('descricao', d.descricao, `placeholder="${inv?'Ex.: Aporte para compra de notebooks':'Ex.: Hospedagem dos sistemas dos clientes'}"`), true)}
    ${campo('Valor (R$)', inp('valor', d.valor?String(d.valor).replace('.',','):'', 'inputmode="decimal" placeholder="0,00"'))}
    <div class="field so-inv" ${inv?'':'hidden'}><label for="f-investidor">Quem investiu</label>${inp('investidor', d.investidor, 'list="investidores" placeholder="Nome de quem colocou o dinheiro"')}<datalist id="investidores">${investidores.map(n=>`<option value="${esc(n)}">`).join('')}</datalist></div>
    <div class="field so-inv" ${inv?'':'hidden'}><label for="f-forma">Forma</label>${sel('forma', FORMAS_INVEST.map(f=>[f,f]), d.forma||FORMAS_INVEST[0])}</div>
    <div class="field so-desp" ${inv?'hidden':''}><label for="f-categoria">Categoria</label>${sel('categoria', CAT_DESPESA.map(c=>[c,c]), d.categoria||CAT_DESPESA[0])}</div>
    <div class="field so-desp" ${inv?'hidden':''}><label for="f-status">Situação</label>${sel('status', [['pago','Paga'],['a_pagar','A pagar']], d.status||'pago')}</div>
    <div class="field so-desp" ${inv?'hidden':''}><label for="f-fornecedor">Fornecedor</label>${inp('fornecedor', d.fornecedor, 'list="fornecedores" placeholder="Ex.: AWS, contador, Google"')}<datalist id="fornecedores">${fornecedores.map(n=>`<option value="${esc(n)}">`).join('')}</datalist></div>
    ${novo?`<div class="field so-desp" ${inv?'hidden':''}><label for="f-rep">Repetir todo mês por</label>${sel('rep', [1,2,3,6,12,18,24,36].map(n=>[n, n===1?'Não repetir':n+' meses']), 1)}</div>`:''}
    ${campo('Observação', `<textarea name="obs" id="f-obs" placeholder="${inv?'Ex.: devolver quando a empresa tiver caixa, entra como participação…':'Nota fiscal, forma de pagamento…'}">${esc(d.obs||'')}</textarea>`, true)}</div>`,
    `${bSalvar()}<span class="sp"></span>${!novo&&canWrite?'<button class="btn danger" data-excluir>Excluir</button>':''}`,
    (f,fechar)=>{
      const L=$('#layer');
      const alterna = ()=>{ const i=f.elements.tipo.value==='investimento'; $$('.so-inv',f).forEach(e=>e.hidden=!i); $$('.so-desp',f).forEach(e=>e.hidden=i); $('.drawer header h2',L).textContent = novo?(i?'Novo investimento':'Nova despesa'):(i?'Investimento':'Despesa'); };
      f.elements.tipo.addEventListener('change', alterna);
      $('[data-salvar]',L)?.addEventListener('click', async()=>{
        const tipo=fv(f,'tipo'), i=tipo==='investimento';
        if(!num(fv(f,'valor'))){ toast('Informe o valor.'); return; }
        if(i && !fv(f,'investidor')){ toast('Informe quem investiu.'); return; }
        const base = {tipo, data:fv(f,'data')||hoje(), descricao:fv(f,'descricao'), valor:num(fv(f,'valor')), obs:fv(f,'obs'), criadoEm:d.criadoEm||hoje()};
        const dados = i ? {...base, investidor:fv(f,'investidor'), forma:fv(f,'forma')} : {...base, categoria:fv(f,'categoria'), status:fv(f,'status'), fornecedor:fv(f,'fornecedor')};
        if (novo && !i){ const n=Number(fv(f,'rep'))||1;
          for(let k=0;k<n;k++){ if(await salvar('despesas', null, {...dados, data:addMeses(dados.data,k), status:k===0?dados.status:'a_pagar', descricao:dados.descricao+(n>1?` · ${k+1}/${n}`:'')})===null) return; }
          toast(n>1?n+' despesas criadas':'Despesa registrada'); }
        else { if(await salvar('despesas', d.id, dados)===null) return; toast(i?'Investimento registrado':'Despesa salva'); }
        fechar(); });
      $('[data-excluir]',L)?.addEventListener('click', async()=>{ if(await excluir('despesas',d.id)){ toast('Lançamento excluído'); fechar(); } });
    });
}

/* ---------- Equipe: gestão de usuários (só administradores) ---------- */
const equipe = {lista:null, fora:[], erro:'', carregando:false};
async function carregarEquipe(forcar){
  if (!adminApi || (equipe.carregando && !forcar)) return;
  equipe.carregando = true; equipe.erro = '';
  try { const r = await adminApi.listar(); equipe.lista = r.usuarios || []; equipe.fora = r.foraDaEquipe || []; }
  catch(e){ equipe.erro = e.message || 'Não foi possível carregar a equipe.'; }
  equipe.carregando = false;
  if (view==='equipe') render();
}
function quandoAcesso(iso){ if(!iso) return 'nunca entrou'; const d=new Date(iso); return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' às '+pad(d.getHours())+':'+pad(d.getMinutes()); }
function vEquipe(){
  const head = `<div class="head"><div><h1>Equipe</h1><p>Quem pode entrar no Hub. Aqui você cadastra pessoas, define e troca senhas e escolhe quem é administrador.</p></div>
    <div class="tools">${adminApi?'<button class="btn" data-act="recarregarEquipe">Atualizar</button><button class="btn primary" data-act="novoUsuario">Novo usuário</button>':''}</div></div>`;
  if (!adminApi) return head + `<div class="empty"><b>Área de administradores</b>Só administradores veem e alteram a equipe.</div>`;
  if (equipe.lista===null && !equipe.erro){ carregarEquipe(); return head + `<p class="sub">Carregando a equipe…</p>`; }
  if (equipe.erro) return head + `<div class="banner" style="background:var(--bad-bg);color:var(--bad)">${esc(equipe.erro)}</div>`;
  const l = [...equipe.lista].sort((a,b)=>(b.admin-a.admin)||a.nome.localeCompare(b.nome,'pt'));

function abrirGaveta(titulo, corpo, rodape, montar){
  const L = $('#layer');
  const anterior = document.activeElement;
  const g = gavetaReg; gavetaReg = null;
  const reg = g?.reg && g.reg.id ? g.reg : null;
  aberto = reg ? {col:g.col, id:reg.id, versao:reg.alteradoEm||''} : null;
  L.innerHTML = `<div class="scrim" data-fechar></div><div class="drawer" role="dialog" aria-modal="true" aria-label="${esc(titulo)}"><header><h2>${esc(titulo)}</h2><button class="btn ghost" data-fechar aria-label="Fechar">Fechar</button></header><form class="body" id="gform" novalidate><div class="banner conflito" id="conflito" hidden></div>${linhaAutoria(reg)}${corpo}</form><footer>${rodape}</footer></div>`;
  preencherNomes(L);
  contarPresenca({editando: reg ? titulo : null});
  const fechar = () => { L.innerHTML=''; aberto=null; contarPresenca({editando:null}); document.removeEventListener('keydown', esc_); anterior?.focus?.(); };
  const esc_ = e => { if (e.key==='Escape') fechar(); };
  document.addEventListener('keydown', esc_);
  $$('[data-fechar]', L).forEach(b=>b.addEventListener('click', fechar));
  $('#gform').addEventListener('submit', e=>e.preventDefault());
  $$('.btn.danger', L).forEach(b=>b.addEventListener('click', e=>{ if(!b.classList.contains('armed')){ e.stopImmediatePropagation(); b.classList.add('armed'); b.textContent='Confirmar exclusão'; } }, true));
  const f = $('#gform'); const primeiro = f.querySelector('input,select,textarea'); primeiro?.focus();
  montar?.(f, fechar);
  return fechar;
}

/* Gerar faturamento (negócio ganho / orçamento aprovado) */
function gerarFaturamento(g){
  if (!canWrite || dbMissing) return;
  const h = hoje();
  abrirGaveta('Lançar faturamento', `<p style="margin:0">Venda fechada com <b>${esc(nomeCliente(g.clienteId))}</b>${g.titulo?' · '+esc(g.titulo):''}. Confira como o valor entra no faturamento.</p>
    <div class="gen"><label class="check"><input type="checkbox" name="usaUnico" id="f-usaUnico" ${g.unico?'checked':''}> Projeto</label>
      <div class="fields">${campo('Valor total (R$)', inp('unico', g.unico?String(g.unico).replace('.',','):'', 'inputmode="decimal"'))}${campo('Parcelas', inp('parcU', 1, 'type="number" min="1" max="24"'))}${campo('Primeiro vencimento', inp('dataU', h, 'type="date"'))}</div></div>
    <div class="gen"><label class="check"><input type="checkbox" name="usaMensal" id="f-usaMensal" ${g.mensal?'checked':''}> Manutenção mensal</label>
      <div class="fields">${campo('Valor por mês (R$)', inp('mensal', g.mensal?String(g.mensal).replace('.',','):'', 'inputmode="decimal"'))}${campo('Quantos meses lançar', inp('mesesM', 12, 'type="number" min="1" max="36"'))}${campo('Primeira mensalidade', inp('dataM', addMeses(h,1), 'type="date"'))}</div></div>
    <p class="sub" id="resumoGen" style="margin:0"></p>`,
    `<button class="btn primary" data-salvar>Lançar no faturamento</button><button class="btn" data-fechar>Agora não</button>`,
    (f,fechar)=>{
      const L=$('#layer');
      const res = ()=>{ const p=[]; if(f.elements.usaUnico.checked&&num(fv(f,'unico'))){ const n=Math.max(1,num(fv(f,'parcU'))); p.push(`${n}× ${brl(num(fv(f,'unico'))/n)} de projeto`); } if(f.elements.usaMensal.checked&&num(fv(f,'mensal'))) p.push(`${Math.max(1,num(fv(f,'mesesM')))} mensalidades de ${brl(num(fv(f,'mensal')))}`); $('#resumoGen').textContent = p.length ? 'Serão criados: '+p.join(' e ')+', todos como Previsto.' : 'Nada marcado para lançar.'; };
      f.addEventListener('input', res); res();
      $('[data-salvar]',L).addEventListener('click', async e=>{
        e.target.disabled=true;
        const lanc=[]; const base={clienteId:g.clienteId, status:'previsto', negocioId:g.negocioId||'', orcamentoId:g.orcamentoId||'', criadoEm:h};
        if (f.elements.usaUnico.checked && num(fv(f,'unico'))){ const n=Math.max(1,Math.round(num(fv(f,'parcU')))), tot=num(fv(f,'unico')), parc=Math.round(tot/n*100)/100;
          for(let i=0;i<n;i++) lanc.push({...base, tipo:'projeto', data:addMeses(fv(f,'dataU')||h,i), valor: i===n-1 ? Math.round((tot-parc*(n-1))*100)/100 : parc, descricao:(g.titulo||'Projeto')+(n>1?` · parcela ${i+1}/${n}`:'')}); }
        if (f.elements.usaMensal.checked && num(fv(f,'mensal'))){ const n=Math.max(1,Math.round(num(fv(f,'mesesM'))));
          for(let i=0;i<n;i++) lanc.push({...base, tipo:'mensal', data:addMeses(fv(f,'dataM')||h,i), valor:num(fv(f,'mensal')), descricao:'Manutenção mensal'+(g.titulo?' · '+g.titulo:'')+` · ${i+1}/${n}`}); }
        let ok=0; for (const l of lanc){ if (await salvar('faturamento', null, l)===null) break; ok++; }
        if (ok && g.negocioId){ const n=byId('negocios',g.negocioId); if(n){ const nd={...n, faturado:true}; delete nd.id; await salvar('negocios', n.id, nd); } }
        if (ok===lanc.length){ toast(ok+' lançamento'+(ok===1?'':'s')+' criado'+(ok===1?'':'s')); fechar(); } else e.target.disabled=false;
      });
    });
}

  if (tipo==='desp') formDespesa(byId('despesas',id));
  if (tipo==='projeto') formProjeto(byId('projetos',id));

  const pn = e.target.closest('[data-projneg]'); if (pn){ const n=byId('negocios',pn.dataset.projneg); if(n) formProjeto(projetoDoNegocio(n)); return; }
  const g = e.target.closest('main [data-go]'); if (g){ go(g.dataset.go); return; }
  const a = e.target.closest('[data-act]');
  if (a && !a.closest('.drawer')){
    const act=a.dataset.act;
    if (act==='novoCliente') formCliente();
    if (act==='novoNegocio') formNegocio({etapa:'lead'});
    if (act==='novoOrcamento') formOrcamento();
    if (act==='novoLanc') formLanc();
    if (act==='novoProduto') formProduto();
    if (act==='novaDespesa') formDespesa({tipo:'despesa'});
    if (act==='novoProjeto') formProjeto({});
    if (act==='novoUsuario') formUsuario();
    if (act==='recarregarEquipe') carregarEquipe(true);
    if (act==='novoInvest') formDespesa({tipo:'investimento'});
    if (act==='limparMes'){ ui.mes=null; render(); }
    if (act==='csv') baixarCSV();
    if (act==='catalogo'){ a.disabled=true; for (const p of CATALOGO){ if(await salvar('produtos', null, {...p, unidade:UNIDADES[p.tipo], preco:0, ativo:true, criadoEm:hoje()})===null) break; } toast('Catálogo criado. Defina os preços de cada produto.'); }
    return;
  }
  const o = e.target.closest('[data-open]'); if (o){ abrir(o.dataset.open); return; }
  const m = e.target.closest('[data-mes]'); if (m){ ui.mes = ui.mes===m.dataset.mes ? null : m.dataset.mes; render(); return; }
  const of = e.target.closest('[data-orcf]'); if (of){ ui.orcStatus=of.dataset.orcf; render(); }
});
document.addEventListener('keydown', e=>{ if (e.key==='Enter' && e.target.matches('[data-open],[data-mes]')) e.target.click(); });
$('#view').addEventListener('input', e=>{ if (e.target.id==='busca'){ ui.busca=e.target.value; const pos=e.target.selectionStart; render(); const b=$('#busca'); b.focus(); b.setSelectionRange(pos,pos); } });
$('#view').addEventListener('change', e=>{ if (e.target.id==='fechados'){ ui.mostrarFechados=e.target.checked; render(); } if (e.target.id==='ano'){ ui.ano=Number(e.target.value); ui.mes=null; render(); } });
// arrastar cartões entre etapas
$('#view').addEventListener('dragstart', e=>{ const c=e.target.closest('.card'); if(c){ e.dataTransfer.setData('text/plain', c.dataset.id); e.dataTransfer.effectAllowed='move'; } });
$('#view').addEventListener('dragover', e=>{ const col=e.target.closest('.col'); if(col){ e.preventDefault(); $$('.col.over').forEach(x=>x!==col&&x.classList.remove('over')); col.classList.add('over'); } });
$('#view').addEventListener('dragleave', e=>{ const col=e.target.closest('.col'); if(col && !col.contains(e.relatedTarget)) col.classList.remove('over'); });
$('#view').addEventListener('drop', e=>{ const col=e.target.closest('.col'); if(!col) return; e.preventDefault(); col.classList.remove('over'); const id=e.dataTransfer.getData('text/plain'); if(id && canWrite) moverEtapa(id, col.dataset.etapa); });

async function baixarCSV(){
  const ano=ui.ano, linhas=[['Data','Cliente','Descrição','Tipo','Situação','Valor','Nota fiscal']];
  state.faturamento.filter(f=>(f.data||'').startsWith(ano+'-')).sort((a,b)=>a.data.localeCompare(b.data)).forEach(f=>linhas.push([dataBR(f.data), nomeCliente(f.clienteId), f.descricao||'', TIPOS[f.tipo]||'', f.status==='recebido'?'Recebido':'Previsto', String(num(f.valor).toFixed(2)).replace('.',','), f.nf||'']));
  const csv='﻿'+linhas.map(l=>l.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\r\n');
  try { await downloads.save({filename:`faturamento-isolutis-${ano}.csv`, data:csv}); } catch(e){ if(e?.code!=='declined') toast('Não foi possível baixar a planilha agora.'); }
}

/* ---------- início ---------- */
$('#logoSide').innerHTML = '<img alt="iSolutis" width="172" height="66" src="'+LOGO_H+'">';
$('#lgLogo').src = LOGO_H;
render();
(async()=>{
  const sync=$('#sync');
  // login e conexão com o Supabase (script "HubSupabase", acima); só segue depois que a pessoa entra
  let plat = null;
  try { plat = await window.HubSupabase.iniciar(); } catch(e){ console.error(e); }
  if (!plat){ dbMissing=true; sync.className='sync off'; sync.innerHTML='<span class="dot"></span>Sem conexão com o banco de dados'; render(); return; }
  const {db:d, user:u, downloads:dl, room:rm} = plat;
  db=d; downloads=dl; userApi=u; room=rm;
  adminApi = plat.admin || null; if (adminApi) AREAS.push(['equipe','Equipe','']);
  if (u){
    try { const w=await u.can('data.write'); if (w===false) canWrite=false; } catch(_){}
    try { const m=await u.me(); eu.id=m.id||null; eu.nome=m.name||''; if (eu.id) nomesCache[eu.id]={name:m.name, avatarUrl:m.avatarUrl}; } catch(_){}
  }
  if (room){
    try { room.onPeers(ch=>desenharOnline(ch.peers), ()=>{ $('#online').hidden=true; }); contarPresenca({editando:null}); } catch(_){}
  }
  sync.className='sync on'; sync.innerHTML='<span class="dot"></span>Dados da equipe sincronizados';
  for (const c of COLS){
    db.collection(c).limit(1000).onSnapshot(s=>{ state[c]=s.docs.map(x=>({...x.data(), id:x.id})); loaded[c]=true; render(); verificarConflito(c); },
      err=>{ console.error(c, err); sync.className='sync off'; sync.innerHTML='<span class="dot"></span>Conexão interrompida. Recarregue a página.'; });
  }
})();
})();
</script>
